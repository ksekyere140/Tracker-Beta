<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tracker Beta - Integrity Verification</title>

    <style>

        body {
            margin: 0;
            padding: 40px;
            background: #0f172a;
            color: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 35px;
        }

        .verified {
            color: #4ade80;
            font-size: 34px;
            font-weight: bold;
        }

        .tampered {
            color: #f87171;
            font-size: 34px;
            font-weight: bold;
        }

        .details {
            margin-top: 25px;
            color: #cbd5e1;
            line-height: 1.8;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 16px;
            background: #1d4ed8;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .button:hover {
            background: #2563eb;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Tracker Beta</h1>

        <div class="card">

            {% if integrity_verified %}

                <div class="verified">
                    VERIFIED
                </div>

            {% else %}

                <div class="tampered">
                    TAMPERING DETECTED
                </div>

            {% endif %}

            <div class="details">

                <strong>Result:</strong>
                {{ integrity_message }}

                <br>

                <strong>Hashed Events Checked:</strong>
                {{ hashed_event_count }}

                <br>

                <strong>Verification Time:</strong>
                {{ checked_at }}

            </div>

            <a
                href="/dashboard"
                class="button"
            >
                Return to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
