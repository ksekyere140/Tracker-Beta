<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tracker Beta - Login</title>

    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            margin: 120px auto;
        }

        .login-card {
            background: #1e293b;
            padding: 35px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 11px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .error {
            margin-top: 20px;
            padding: 10px;
            background: #7f1d1d;
            color: #fecaca;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Tracker Beta</h1>

            <div class="subtitle">
                Security Monitor
            </div>

            <form method="POST">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    autocomplete="username"
                    required
                    autofocus
                >

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Sign In
                </button>

            </form>

            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
